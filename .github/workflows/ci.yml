name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned toolchain
        id: pin
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"[[:space:]]*$/\1/p' rust-toolchain.toml)
          if [ "$(printf '%s\n' "$channel" | wc -l)" -ne 1 ] || ! printf '%s\n' "$channel" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=rust-toolchain.toml::expected exactly one line 'channel = \"X.Y.Z\"' (an exact version); found '${channel}'"
            exit 1
          fi
          echo "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: rustfmt
      - name: Show the toolchain
        run: rustc --version && cargo --version && cargo fmt --version
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned toolchain
        id: pin
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"[[:space:]]*$/\1/p' rust-toolchain.toml)
          if [ "$(printf '%s\n' "$channel" | wc -l)" -ne 1 ] || ! printf '%s\n' "$channel" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=rust-toolchain.toml::expected exactly one line 'channel = \"X.Y.Z\"' (an exact version); found '${channel}'"
            exit 1
          fi
          echo "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: clippy
      - name: Show the toolchain
        run: rustc --version && cargo --version && cargo clippy --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned toolchain
        id: pin
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"[[:space:]]*$/\1/p' rust-toolchain.toml)
          if [ "$(printf '%s\n' "$channel" | wc -l)" -ne 1 ] || ! printf '%s\n' "$channel" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=rust-toolchain.toml::expected exactly one line 'channel = \"X.Y.Z\"' (an exact version); found '${channel}'"
            exit 1
          fi
          echo "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
      - name: Show the toolchain
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
