name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read the pinned toolchain
        id: pin
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"[[:space:]]*$/\1/p' rust-toolchain.toml)
          if [ "$(printf '%s\n' "$channel" | wc -l)" -ne 1 ] || ! printf '%s\n' "$channel" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=rust-toolchain.toml::expected exactly one line 'channel = \"X.Y.Z\"' (an exact version); found '${channel}'"
            exit 1
          fi
          echo "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
      - name: Show the toolchain
        run: rustc --version && cargo --version
      - name: Tag matches the workspace version and is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version v$version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; tag a commit that has been merged"
            exit 1
          fi

  test:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned toolchain
        id: pin
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"[[:space:]]*$/\1/p' rust-toolchain.toml)
          if [ "$(printf '%s\n' "$channel" | wc -l)" -ne 1 ] || ! printf '%s\n' "$channel" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=rust-toolchain.toml::expected exactly one line 'channel = \"X.Y.Z\"' (an exact version); found '${channel}'"
            exit 1
          fi
          echo "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: rustfmt, clippy
      - name: Show the toolchain
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            smoke: true
          - target: x86_64-apple-darwin
            os: macos-14
            smoke: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            smoke: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned toolchain
        id: pin
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"[[:space:]]*$/\1/p' rust-toolchain.toml)
          if [ "$(printf '%s\n' "$channel" | wc -l)" -ne 1 ] || ! printf '%s\n' "$channel" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=rust-toolchain.toml::expected exactly one line 'channel = \"X.Y.Z\"' (an exact version); found '${channel}'"
            exit 1
          fi
          echo "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: ${{ matrix.target }}
      - name: Show the toolchain
        run: rustc --version && cargo --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        env:
          T: ${{ matrix.target }}
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          # cc looks for <arch>-linux-musl-gcc, which musl-tools does not ship.
          echo "CC_$(printf '%s' "$T" | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"
      - name: Record the build commit
        run: echo "CHOCO_BUILD_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build
        env:
          T: ${{ matrix.target }}
        run: cargo build --release --locked --target "$T" -p choco -p chocofactoryd
      - name: Package
        env:
          T: ${{ matrix.target }}
        run: scripts/package-release.sh "$T" "target/$T/release" dist
      - name: Smoke test
        if: matrix.smoke
        env:
          T: ${{ matrix.target }}
        run: |
          EXPECT_VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          export EXPECT_VERSION
          scripts/release-smoke.sh "dist/chocofactory-$T.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chocofactory-${{ matrix.target }}
          path: dist/chocofactory-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          cd dist
          sha256sum chocofactory-*.tar.gz > SHA256SUMS
          printf '{"version":"%s","commit":"%s"}\n' "${TAG#v}" "${GITHUB_SHA::7}" > manifest.json
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$TAG" chocofactory-*.tar.gz SHA256SUMS manifest.json ../install.sh \
            --title "$TAG" --generate-notes $prerelease
