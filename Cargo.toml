[workspace]
resolver = "2"
members = [
    "chocofactoryd",
    "choco",
    "chocofactory-core",
    "mock-claude",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chocofactory-core = { path = "chocofactory-core" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
indexmap = { version = "2", features = ["serde"] }
# Only for `killpg` — a shell stage's timeout has to reap the command's
# whole process group, not just the `sh` the daemon spawned (§5.2).
# Already in the tree via tokio, so this pulls in nothing new.
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "chrono",
    "json",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
tokio-tungstenite = "0.24"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
