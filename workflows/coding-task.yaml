name: coding-task
worktree: true
roles:
  coder:
    cli: claude
    model: claude-sonnet-5-5
    system_prompt_file: prompts/coder-system.md
  reviewer:
    cli: claude
    model: claude-opus-5-5
    system_prompt_file: prompts/reviewer-system.md
    read_only: true
    disallowed_tools: [edit, write, notebook_edit]

stages:
  # First attempt at the task. Every later return path (a failed review, a
  # human's redirect, red CI, a PR review requesting changes) lands on
  # `revising`, not back here — see `revising`'s own comment.
  coding:
    kind: agent_turn
    role: coder
    prompt_file: prompts/coder-turn.md
    on: { done: internal_review }

  # The single landing spot for every way work comes back. The coder is an
  # agent with tool access, so it can look up *why* it's back itself (CI
  # logs, PR comments); only what it genuinely can't look up — a reviewer's
  # own summary, or a human's redirect note — gets templated in
  # (`coder-revise.md`). The prompt branches on `{{ arrival.from }}`/
  # `{{ arrival.outcome }}` (#112, the engine's own record of the transition
  # that landed here), not on which capture happens to be populated: both
  # `stages.internal_review.summary` and `stages.escalate_to_human` persist
  # across laps once either stage has ever run, so the prompt labels each
  # one with the arrival path it's current for and tells the coder to
  # ignore it on every other path.
  revising:
    kind: agent_turn
    role: coder
    prompt_file: prompts/coder-revise.md
    on: { done: internal_review }

  # The reviewer states its verdict by calling `report_outcome(outcome,
  # summary)` (#73) rather than replying with structured JSON; `capture: json`
  # reads `on:`'s next stage straight from the call's `outcome` argument, with
  # a same-shaped-JSON-reply fallback for a turn that never calls the tool.
  #
  # `report_sections:` is what stops the review ending at its first blocking
  # finding (#95). On #88 the first lap named four untested branches, had
  # enough to reject, and stopped; the next lap — on a commit that added only
  # tests — found two more defects and a third it had seen and waved through,
  # all of them already in the code the first lap read. The verdict was
  # decidable early; the walks weren't done. The tool rejects a report that
  # leaves a section out, so there is no way to file a verdict without also
  # filing the walks behind it. The list is every walk `reviewer-system.md`
  # step 3 asks for, plus the sections around them — review of #95 caught
  # this list two walks short of the prompt, and the two missing ones
  # ("Resources and work", "Old behaviour") are exactly where this repo's
  # recurring defects live. "Prior findings" is not among them because a
  # first lap has none, and the turn prompt asks for it when there are.
  #
  # `reviewer-turn.md` templates this stage's *own* previous capture, which
  # is how a re-review gets the earlier report without the engine carrying
  # anything new. On a first review there is no capture yet, so the
  # placeholder renders empty. That is normal, so the engine only logs it:
  # a reference to a stage that hasn't finished a run yet records no
  # `template_unresolved` note on the task's timeline (#60). The same holds
  # for `coder-revise.md`, where an empty one of two alternatives is the
  # normal case rather than a mistake.
  internal_review:
    kind: agent_turn
    role: reviewer
    prompt_file: prompts/reviewer-turn.md
    capture: json
    report_sections:
      - Reviewed
      - Predictions
      - Branches → tests
      - States
      - Messages
      - Side effects
      - Resources and work
      - Old behaviour
      - Findings
      - Dismissed
    on:
      approved: open_pr
      changes_requested: revising
    loop_guard: { on: changes_requested, max: 3, then: escalate_to_human }

  # Reached because any of the three loop guards trips (`internal_review`'s,
  # `checks_polling`'s or `awaiting_human_review`'s), because `open_pr` itself failed (see
  # below), because CI has not finished within 30 minutes (the `timeout` of
  # `checks_polling`) or has a cancelled, startup-failure or action-required
  # check (`ci_cancelled`, `ci_startup_failure`, `ci_action_required`), or
  # because no human review arrives within 6h
  # (the `timeout` of `awaiting_human_review`'s watcher). Arriving here restarts all three
  # loop guards' counts (§5.3), whichever of those brought the task here,
  # so a human resuming from this stage always hands the loop a fresh
  # budget. `capture: text` keeps the human's reply so `revising` can see
  # what they said.
  escalate_to_human:
    kind: human_gate
    capture: text
    on: { resumed: revising }

  # The probe (`gh pr list --state open`, never `gh pr view`), the
  # conditional create (#78), the refresh of an existing PR's description
  # and the fail-closed read-back all live in `scripts/open-pr.sh`, with
  # their rationale; read it there. Agent-written text reaches the script
  # only through the `env:` map below and the description file the coder
  # leaves in git's private directory — never through a shell command line
  # (a `command:` is templated as raw text; a `script_file:` is not).
  open_pr:
    kind: shell
    script_file: scripts/open-pr.sh
    env:
      PR_TASK_TITLE: "{{ task.title }}"
      PR_REVIEW_VERDICT: "{{ stages.internal_review.outcome }}"
      PR_REVIEW_REPORT: "{{ stages.internal_review.summary }}"
    capture: json
    timeout: 5m
    on: { done: checks_polling, error: escalate_to_human }

  # `scripts/ci-checks.sh` reads the PR's checks and prints one token per
  # result (rules in its header). A real failure is `red` and goes back to
  # the coder; a cancelled, startup-failure or action-required check, and
  # 30 minutes without a result, need a person and escalate; a PR with no
  # checks at all reaches review as `no_checks` after 3 minutes.
  checks_polling:
    kind: poll
    script_file: scripts/ci-checks.sh
    env:
      PR_NUMBER: "{{ stages.open_pr.number }}"
    interval: 30s
    timeout: 30m
    outcomes:
      - match: '\ARED(\n|$)'
        then: red
      - match: '\ASTARTUP_FAILURE(\n|$)'
        then: ci_startup_failure
      - match: '\AACTION_REQUIRED(\n|$)'
        then: ci_action_required
      - match: '\ACANCELLED(\n|$)'
        then: ci_cancelled
      - match: '\AGREEN(\n|$)'
        then: green
      - match: '\ANO_CHECKS(\n|$)'
        then: no_checks
    on:
      green: awaiting_human_review
      no_checks: awaiting_human_review
      red: revising
      ci_startup_failure: escalate_to_human
      ci_action_required: escalate_to_human
      ci_cancelled: escalate_to_human
      timeout: escalate_to_human
    # CI that keeps failing while `internal_review` keeps approving would
    # otherwise loop forever, one paid coder lap and one paid reviewer lap
    # per round. The guard parks the task at `escalate_to_human` on the 4th
    # red in a row. Any other outcome resets the count.
    loop_guard: { on: red, max: 3, then: escalate_to_human }

  # This stage waits on a person, who answers either on the PR (read by
  # the watcher below) or with `choco task send`. A choco reply is read
  # for the same marker lines, by the same rule, as a PR comment. A reply
  # with no marker, or with both, is refused and changes nothing. An
  # accepted reply stops the watcher, and its text minus the marker line
  # is what `revising` gets as the human's review. The line rule is
  # pinned by `chocofactoryd/tests/fixtures/review-markers.json`, so
  # `markers:` here and the script's `VERDICT` filter must change together.
  #
  # Watches the PR's *comments*, not its `reviewDecision`. GitHub refuses
  # a formal review from the account that opened the PR, and `open_pr`
  # pushes under whatever identity the daemon inherited — on a solo repo
  # that's the same person, so `reviewDecision` stays empty forever
  # (#78). Commenting on your own PR is allowed, so the verdict is a
  # marker line in a comment: `/approve` or `/request-changes`.
  #
  # Only comments newer than the head commit count. That's what keeps a
  # verdict from being re-read on the next lap: `revising` pushes a new
  # commit, which moves `SINCE` past every existing comment, so last
  # round's `/request-changes` stops matching without anything having to
  # clear it. `[created_at, updated_at] | max` rather than `created_at`
  # alone, so *editing* an earlier comment to add the marker counts —
  # which is the move a reviewer who already wrote their prose reaches
  # for first.
  #
  # A merged PR counts as approval (#102): the script prints `MERGED` and
  # skips the comments, so a PR merged without a marker comment moves on
  # at the next lap instead of polling until the timeout. Merged wins over
  # a marker, since there is nothing left to revise once it has landed.
  # A PR closed without merging is nothing new: polling continues.
  #
  # Both halves of that bound are read the long way round on purpose.
  # `gh pr view --json commits,comments` caps each at the first 100 with
  # no pagination, so on a long PR `.commits | last` is not the head (a
  # stale `SINCE` re-admits verdicts already acted on) and a verdict
  # posted as comment 101 is invisible. Hence `headRefOid` plus the
  # commits API for the date, and `--paginate` for the comments.
  #
  # Residual, accepted: `committedDate` comes from the daemon's clock
  # while `created_at` comes from GitHub's, so a daemon running more than
  # a few minutes slow can re-admit one already-consumed verdict. The
  # loop guard below bounds that at three laps rather than a spin.
  #
  # `scripts/await-review.sh` resolves the verdict itself and prints it
  # as the first line, so the engine's regexes anchor to the start of the
  # output (`\A`) rather than picking a marker out of free text. Below the
  # first line it prints the qualifying comments (#138), which `revising`
  # renders into the coder's prompt. A comment body containing a line
  # `APPROVE` cannot change the outcome: the patterns accept the token only
  # as the first line. (`outcomes.matching` trims stdout and matches the
  # whole of it, `$` meaning end of output.) `/request-changes` is tested
  # first: a comment carrying both markers must never resolve to "merge
  # it". The script's own header documents the selection, the output
  # format and the two-call trade-off.
  #
  # Two author fences, because on a *public* repo the comment box is open
  # to the whole internet and this stage spends money. `authorAssociation`
  # is the real boundary — only someone with standing in the repo can vote
  # — without which any passer-by could `/approve` a task to `done`, or
  # burn a coder+reviewer lap at a time with `/request-changes`. The
  # `[bot]` check is the narrower one on top: it keeps the CI reviewer
  # from ever being read as the human's verdict, even if it is granted
  # write access later. Note neither fence distinguishes *you* from an
  # agent acting as you — anything commenting under your account counts.
  #
  # A marker counts only as a whole line (compared by equality after
  # trailing whitespace and CR are stripped, not by substring). That is
  # what makes quoting safe: GitHub prefixes quoted lines with "> ", so
  # quoting an earlier verdict can't re-trigger it, and an inline
  # mention can't either. It does *not* exempt fenced code blocks — the
  # API returns raw markdown, so a marker alone on a line inside a fence
  # still votes.
  awaiting_human_review:
    kind: human_gate
    capture: text
    markers:
      - line: /request-changes
        then: changes_requested
      - line: /approve
        then: approved
    watch:
      script_file: scripts/await-review.sh
      env:
        PR_NUMBER: "{{ stages.open_pr.number }}"
      interval: 60s
      timeout: 6h
      outcomes:
        - match: '\AREQUEST_CHANGES(\n|$)'
          then: changes_requested
        - match: '\AAPPROVE(\n|$)'
          then: approved
        - match: '\AMERGED(\n|$)'
          then: approved
    on:
      approved: done
      changes_requested: revising
      # Nobody reviewed in 6h. `done` would claim an approval that never
      # happened and `revising` would loop the coder on no feedback, so
      # this parks the task where a human can pick it up deliberately.
      timeout: escalate_to_human
    # A verdict stays newer than the head commit until the coder pushes,
    # so a `revising` lap that produces no commit — or a slow daemon
    # clock — would re-read the same `/request-changes` and spin. Same
    # bound `internal_review` uses.
    loop_guard: { on: changes_requested, max: 3, then: escalate_to_human }

  done:
    kind: terminal
