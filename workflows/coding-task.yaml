name: coding-task
worktree: true
roles:
  coder:
    cli: claude
    model: claude-sonnet-5-5
    system_prompt_file: prompts/coder-system.md
  reviewer:
    cli: claude
    model: claude-opus-5-5
    system_prompt_file: prompts/reviewer-system.md
    read_only: true
    disallowed_tools: [edit, write, notebook_edit]
  writer:
    cli: claude
    model: claude-sonnet-5-5
    system_prompt_file: prompts/writer-system.md
    read_only: true
    disallowed_tools: [edit, write, notebook_edit]

stages:
  # First attempt at the task. Every later return path (a failed review, a
  # human's redirect, an answered blocker, red CI, a PR review requesting
  # changes, a PR that started conflicting with its base) lands on
  # `revising`, not back here — see `revising`'s own comment.
  #
  # The coder may instead stop by reporting `blocked`, when the task tells it
  # to stop in the situation it is in or every way forward breaks a rule the
  # task sets (`coder-system.md`, "When you can't go on"). That lands on
  # `blocker`. `capture: json` is what makes the exit routable, and it keeps
  # the coder's report with the stage's result so the next lap, which is a
  # fresh session, can read it back with `get_context`. The task text is not
  # in the prompt: the coder reads it with `{"source":"task"}`.
  coding:
    kind: agent_turn
    role: coder
    prompt_file: prompts/coder-turn.md
    capture: json
    on: { done: internal_review, blocked: blocker }

  # The single landing spot for every way work comes back. The coder is an
  # agent with tool access, so it can look up *why* it's back itself (CI
  # logs, PR comments). Nothing it can't look up is templated into the prompt
  # any more: the reviewer's report, the human's hand-offs, a conflict note and
  # its own earlier reports are read with `get_context` (`coder-revise.md`),
  # by following the result links from the point where this turn started. The
  # prompt still branches on `{{ arrival.from }}`/`{{ arrival.outcome }}`
  # (#112, the engine's own record of the transition that landed here) to say
  # why the coder is back, but the arrival alone never says which human
  # instruction governs: the coder finds it in the linked history, and it stays
  # in force through later internal review rounds until another human
  # instruction replaces it. `revising` can itself report `blocked`, which
  # lands on `blocker` again.
  revising:
    kind: agent_turn
    role: coder
    prompt_file: prompts/coder-revise.md
    capture: json
    on: { done: internal_review, blocked: blocker }

  # The reviewer states its verdict by calling `report_outcome(outcome,
  # summary)` (#73) rather than replying with structured JSON; `capture: json`
  # reads `on:`'s next stage straight from the call's `outcome` argument, with
  # a same-shaped-JSON-reply fallback for a turn that never calls the tool.
  #
  # `report_sections:` is what stops the review ending at its first blocking
  # finding (#95). On #88 the first lap named four untested branches, had
  # enough to reject, and stopped; the next lap — on a commit that added only
  # tests — found two more defects and a third it had seen and waved through,
  # all of them already in the code the first lap read. The verdict was
  # decidable early; the walks weren't done. The tool rejects a report that
  # leaves a section out, so there is no way to file a verdict without also
  # filing the walks behind it. The list is every walk `reviewer-system.md`
  # step 3 asks for, plus the sections around them — review of #95 caught
  # this list two walks short of the prompt, and the two missing ones
  # ("Resources and work", "Old behaviour") are exactly where this repo's
  # recurring defects live. "Prior findings" is not among them because a
  # first lap has none, and the turn prompt asks for it when there are.
  #
  # `reviewer-turn.md` no longer templates the task, the previous report or
  # the human's hand-offs. The reviewer reads them with `get_context`, from the
  # point where this review started: its own previous report (the latest result
  # that left this stage), the coder's latest report and the human request that
  # governs. It decides what may block from that (`reviewer-system.md`, "Review
  # scope"): a first review is the whole branch, a reviewer-started round only
  # unresolved blockers and what the corrections caused, a human's round only
  # the human's request. A review is called "first" only on a chain that is
  # positively the initial one; context it can't read is a refusal to approve,
  # never a first review.
  internal_review:
    kind: agent_turn
    role: reviewer
    prompt_file: prompts/reviewer-turn.md
    capture: json
    report_sections:
      - Reviewed
      - Predictions
      - Branches → tests
      - States
      - Messages
      - Side effects
      - Resources and work
      - Old behaviour
      - Findings
      - Dismissed
    on:
      approved: describe_pr
      changes_requested: revising
    loop_guard: { on: changes_requested, max: 3, then: escalate_to_human }

  # Writes the pull request's description from the spec, the coder's work
  # report, the internal reviewer's report and the branch's commits and diff
  # (`writer-system.md`), and reports it as its summary, which `open_pr`
  # publishes. It runs after every approval, so each round's description is
  # new text. It is read-only: if choco detects a change to the worktree when
  # the turn ends, the task parks, and choco does not undo that change. The
  # operator inspects the worktree and resets any change before retrying; a
  # plain retry can take the retained change as its new starting point. The
  # check covers the checked-out files, their git state and the branch, not
  # ignored files, other git metadata, files outside the worktree or what a
  # shell command sends elsewhere. Human PR comments and hand edits don't
  # reach it: wrong or incomplete prose is corrected by hand on the PR, not
  # with `/request-changes`, which costs a coder lap and a review lap.
  describe_pr:
    kind: agent_turn
    role: writer
    prompt_file: prompts/writer-turn.md
    capture: json
    on: { done: open_pr }

  # Reached because any of the four loop guards trips (`internal_review`'s,
  # `checks_polling`'s, `awaiting_human_review`'s or `base_conflict`'s), because `open_pr` itself failed (see
  # below), because CI has not finished within 30 minutes (the `timeout` of
  # `checks_polling`) or has a cancelled, startup-failure or action-required
  # check (`ci_cancelled`, `ci_startup_failure`, `ci_action_required`), or
  # because no human review arrives within 102h (about four days: polled every
  # minute for 6h, every 5 minutes for the next 24h, every 30 minutes for the
  # next 3 days; the `timeout` of `awaiting_human_review`'s watcher). Arriving here restarts all four
  # loop guards' counts (§5.3), whichever of those brought the task here,
  # so a human resuming from this stage always hands the loop a fresh
  # budget. `capture: text` keeps the human's reply so `revising` can see
  # what they said. If the PR is merged by hand while the task waits here, the
  # `watch` below sees it (`scripts/await-merge.sh`: only the merged state
  # counts, never reviews or conflicts) and the task is `done`, not cancelled.
  escalate_to_human:
    kind: human_gate
    capture: text
    watch:
      script_file: scripts/await-merge.sh
      env:
        PR_NUMBER: "{{ stages.open_pr.number }}"
      interval: 60s
      # The cadence of `awaiting_human_review`, counted from entering this
      # gate. No `timeout`: a parked gate waits for its human indefinitely.
      backoff:
        - { after: 6h, interval: 5m }
        - { after: 30h, interval: 30m }
      outcomes:
        - match: '\AMERGED(\n|$)'
          then: merged
    on: { resumed: revising, merged: done }

  # Reached when the coder reports `blocked` from `coding` or `revising`: it
  # hit a rule the task sets that leaves no way forward, and stopped instead of
  # breaking it. The coder's report (the result that left `coding` or
  # `revising`) is the briefing; read it with
  # `choco --json task status <id>`. The human answers with
  # `choco task send <id> --text "..."`. The answer goes to `revising` and is
  # also read by the internal reviewer through `get_context` (`reviewer-turn.md`),
  # where it wins over the task text. `capture: text` keeps it. There is no loop guard, because
  # every round here waits on a human, and arriving here resets no loop count.
  # A PR merged by hand in the meantime ends the task as `done`, as at
  # `escalate_to_human`.
  blocker:
    kind: human_gate
    capture: text
    watch:
      script_file: scripts/await-merge.sh
      env:
        PR_NUMBER: "{{ stages.open_pr.number }}"
      interval: 60s
      # The cadence of `awaiting_human_review`, counted from entering this
      # gate. No `timeout`: a parked gate waits for its human indefinitely.
      backoff:
        - { after: 6h, interval: 5m }
        - { after: 30h, interval: 30m }
      outcomes:
        - match: '\AMERGED(\n|$)'
          then: merged
    on: { resumed: revising, merged: done }

  # The probe (`gh pr list --state open`, never `gh pr view`), the
  # conditional create (#78), the refresh of an existing PR's description
  # and the fail-closed read-back all live in `scripts/open-pr.sh`, with
  # their rationale; read it there. Agent-written text reaches the script
  # only through the `env:` map below (the task title, the writer's
  # description and the internal reviewer's verdict and report) — never
  # through a shell command line (a `command:` is templated as raw text; a
  # `script_file:` is not).
  open_pr:
    kind: shell
    script_file: scripts/open-pr.sh
    env:
      PR_TASK_TITLE: "{{ task.title }}"
      PR_DESCRIPTION: "{{ stages.describe_pr.summary }}"
      PR_REVIEW_VERDICT: "{{ stages.internal_review.outcome }}"
      PR_REVIEW_REPORT: "{{ stages.internal_review.summary }}"
    capture: json
    timeout: 5m
    on: { done: checks_polling, error: escalate_to_human }

  # `scripts/ci-checks.sh` reads the PR's checks and prints one token per
  # result (rules in its header). A real failure is `red` and goes back to
  # the coder; a cancelled, startup-failure or action-required check, and
  # 30 minutes without a result, need a person and escalate; a PR with no
  # checks at all reaches review as `no_checks` after 3 minutes.
  checks_polling:
    kind: poll
    script_file: scripts/ci-checks.sh
    env:
      PR_NUMBER: "{{ stages.open_pr.number }}"
      # Opt-in re-run of the failed CI jobs once per head ("on"/"off"); see the header of scripts/ci-checks.sh.
      CI_RERUN_FAILED: "off"
    interval: 30s
    timeout: 30m
    outcomes:
      - match: '\ARED(\n|$)'
        then: red
      - match: '\ASTARTUP_FAILURE(\n|$)'
        then: ci_startup_failure
      - match: '\AACTION_REQUIRED(\n|$)'
        then: ci_action_required
      - match: '\ACANCELLED(\n|$)'
        then: ci_cancelled
      - match: '\AGREEN(\n|$)'
        then: green
      - match: '\ANO_CHECKS(\n|$)'
        then: no_checks
    on:
      green: awaiting_human_review
      no_checks: awaiting_human_review
      red: revising
      ci_startup_failure: escalate_to_human
      ci_action_required: escalate_to_human
      ci_cancelled: escalate_to_human
      timeout: escalate_to_human
    # CI that keeps failing while `internal_review` keeps approving would
    # otherwise loop forever, one paid coder lap and one paid reviewer lap
    # per round. The guard parks the task at `escalate_to_human` on the 4th
    # red in a row. Any other outcome resets the count.
    loop_guard: { on: red, max: 3, then: escalate_to_human }

  # This stage waits on a person, who answers either on the PR (read by
  # the watcher below) or with `choco task send`. A choco reply is read
  # for the same marker lines, by the same rule, as a PR comment. A reply
  # with no marker, or with both, is refused and changes nothing. An
  # accepted reply stops the watcher, and its text minus the marker line
  # is what `revising` gets as the human's review. The line rule is
  # pinned by `chocofactoryd/tests/fixtures/review-markers.json`, so
  # `markers:` here and the script's `VERDICT` and `REVIEW_VERDICT` filters
  # must change together.
  #
  # Watches the PR's *comments and reviews*, not its `reviewDecision`.
  # GitHub refuses an approving or changes-requesting review from the
  # account that opened the PR, and `open_pr` pushes under whatever
  # identity the daemon inherited — on a solo repo that's the same person,
  # so `reviewDecision` stays empty forever (#78). Commenting on your own
  # PR is allowed, so the author's verdict is a marker line in a comment or
  # in the body of a "Comment" review: `/approve` or `/request-changes`.
  # Another collaborator's APPROVED or CHANGES_REQUESTED review votes by its
  # state alone. The newest vote across comments and reviews decides.
  #
  # Only comments and reviews newer than the last hand-off count (a review
  # by its `submitted_at`; pending and dismissed reviews never count). The
  # hand-off is the time the engine last moved the task out of this stage,
  # passed in as `HANDED_OVER_AT` (`left_at`, whole-second UTC). That's what
  # keeps a verdict from being re-read on the next lap, whether or not the
  # coder pushes a commit: everything the gate saw before it let go is
  # never counted again, and a review submitted while the coder revises is
  # carried into the next round. Before the first hand-off (the first
  # round, or a task from before `left_at` existed) `HANDED_OVER_AT` is
  # empty and the fence is the head commit's committer date. A malformed
  # value makes the script fail rather than fall back. `[created_at,
  # updated_at] | max` rather than `created_at` alone, so *editing* an
  # earlier comment to add the marker counts (an edit after the hand-off
  # is a new act) — which is the move a reviewer who already wrote their
  # prose reaches for first. A review has no edit time: editing one after
  # the hand-off does not count, post a new one. A vote cast while the
  # coder revises, approval included, is read when the task next reaches
  # the gate.
  #
  # A merged PR counts as approval (#102): the script prints `MERGED` and
  # skips the comments and reviews, so a PR merged without a marker comment moves on
  # at the next lap instead of polling until the timeout. Merged wins over
  # a marker, since there is nothing left to revise once it has landed.
  # A PR closed without merging is nothing new: polling continues.
  #
  # A third finding (#342): an OPEN PR whose `mergeable` is CONFLICTING.
  # Order: merged, then `/request-changes`, then a conflict, then
  # `/approve`. The conflict goes to `base_conflict` and `revising` for a
  # rebase. An approval of a conflicting PR is set aside on purpose (the
  # hand-off time moves past it; the output says so): approve again when
  # the rebased PR is back. `/request-changes` wins over a conflict, and
  # that round's coder lap rebases too. An UNKNOWN `mergeable` holds an
  # approval for one more poll (GitHub computes it lazily) and never starts
  # a round. On this path the gate's capture holds the conflict note
  # followed by the same comment render a verdict prints (marker or not), so
  # the fence moving past them loses nothing.
  #
  # Both halves of the first-round bound are read the long way round on
  # purpose. `gh pr view --json commits,comments` caps each at the first 100
  # with no pagination, so on a long PR `.commits | last` is not the head (a
  # stale `SINCE` re-admits verdicts already acted on) and a verdict
  # posted as comment 101 is invisible. Hence `headRefOid` plus the
  # commits API for the date, and `--paginate` for the comments and reviews.
  #
  # Residual, accepted:
  #  - Clock. The hand-off time is the daemon host's clock, GitHub's
  #    timestamps are GitHub's. A host clock behind GitHub's by more than
  #    the age of the deciding vote at hand-off can re-admit that vote; the
  #    loop guard below bounds that. A clock ahead drops items posted
  #    within that skew after the hand-off.
  #  - Read-to-hand-off window. An item posted after the script's reads but
  #    before the engine commits the transition is neither handed over nor
  #    counted later. Usually under a second; the same second is excluded
  #    by truncation.
  #  - Timeout, resumed. Non-marker comments posted before the 102h timeout
  #    are not handed over after `choco task send` resumes; the human's
  #    resume note is the hand-off there.
  #  - Timeout, rewatched. After `choco task retry` watches again, comments
  #    and reviews posted before the timeout do not count (rewatch writes no
  #    hand-off time), including a verdict posted in the last polling
  #    interval before the timeout, which no final poll read. Post it again.
  #  - Votes during a revision. A request for changes read by the coder on
  #    the PR still starts another round; an approval there, if it is the
  #    newest vote and the PR does not conflict, moves the task to `done`
  #    unseen. `done` merges nothing.
  #  - Stale MERGEABLE. A read right after the base moved can still say
  #    MERGEABLE for about 3 s; an approval read then finishes the task on
  #    a PR that just started conflicting, as one posted before the move.
  #  - `choco task send <id> --text /approve` is acted on without a
  #    conflict check (the markers path is the engine's, not the
  #    watcher's). Check `gh pr view <n> --json mergeable` first.
  #  - UNKNOWN at timeout. An approval read while `mergeable` is UNKNOWN on
  #    the final look before the 102h timeout is held, so the task parks
  #    instead of finishing; approve again after `choco task retry`.
  #
  # `scripts/await-review.sh` resolves the verdict itself and prints it
  # as the first line, so the engine's regexes anchor to the start of the
  # output (`\A`) rather than picking a marker out of free text. Below the
  # first line it prints the qualifying comments (#138), which `revising`
  # renders into the coder's prompt. A comment body containing a line
  # `APPROVE` cannot change the outcome: the patterns accept the token only
  # as the first line. (`outcomes.matching` trims stdout and matches the
  # whole of it, `$` meaning end of output.) `/request-changes` is tested
  # first: a comment carrying both markers must never resolve to "merge
  # it". The script's own header documents the selection, the output
  # format and the separate-calls trade-off.
  #
  # Two author fences, because on a *public* repo the comment box is open
  # to the whole internet and this stage spends money. `authorAssociation`
  # is the real boundary — only someone with standing in the repo can vote
  # — without which any passer-by could `/approve` a task to `done`, or
  # burn a coder+reviewer lap at a time with `/request-changes`. The
  # `[bot]` check is the narrower one on top: it keeps the CI reviewer
  # from ever being read as the human's verdict, even if it is granted
  # write access later. Note neither fence distinguishes *you* from an
  # agent acting as you — anything commenting under your account counts.
  #
  # A marker counts only as a whole line (compared by equality after
  # trailing whitespace and CR are stripped, not by substring). That is
  # what makes quoting safe: GitHub prefixes quoted lines with "> ", so
  # quoting an earlier verdict can't re-trigger it, and an inline
  # mention can't either. It does *not* exempt fenced code blocks — the
  # API returns raw markdown, so a marker alone on a line inside a fence
  # still votes.
  awaiting_human_review:
    kind: human_gate
    capture: text
    markers:
      - line: /request-changes
        then: changes_requested
      - line: /approve
        then: approved
    watch:
      script_file: scripts/await-review.sh
      env:
        PR_NUMBER: "{{ stages.open_pr.number }}"
        # The time the task last left this stage; empty on the first visit.
        HANDED_OVER_AT: "{{ left_at.awaiting_human_review }}"
      interval: 60s
      # Every minute for the first 6h, every 5 minutes up to 30h, then every
      # 30 minutes until the 102h timeout.
      backoff:
        - { after: 6h, interval: 5m }
        - { after: 30h, interval: 30m }
      timeout: 102h
      outcomes:
        - match: '\AREQUEST_CHANGES(\n|$)'
          then: changes_requested
        - match: '\AAPPROVE(\n|$)'
          then: approved
        - match: '\AMERGED(\n|$)'
          then: approved
        - match: '\ACONFLICTING(\n|$)'
          then: conflicting
    on:
      approved: done
      changes_requested: revising
      conflicting: base_conflict
      # Nobody reviewed in 102h (see `watch` above). `done` would claim an approval that never
      # happened and `revising` would loop the coder on no feedback, so
      # this parks the task where a human can pick it up deliberately.
      timeout: escalate_to_human
    # The hand-off fence means a verdict already handed over is not read
    # again, commit or no commit; this bounds human rounds. A slow daemon
    # clock or a re-edited comment can still repeat a verdict. Same bound
    # `internal_review` uses.
    loop_guard: { on: changes_requested, max: 3, then: escalate_to_human }

  # Does nothing but count conflict rounds (#342): the gate sends a PR that
  # stopped merging cleanly here, and the guard parks the task at
  # `escalate_to_human` on the 4th since the last escalation. It counts
  # conflicts in total, not in a row, and separately from the human's three
  # `changes_requested` rounds. It never ends any other way, so only an
  # arrival at `escalate_to_human` starts its count over.
  base_conflict:
    kind: shell
    command: "true"
    on: { done: revising }
    loop_guard: { on: done, max: 3, then: escalate_to_human }

  done:
    kind: terminal
